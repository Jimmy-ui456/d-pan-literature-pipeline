name: package-validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and build tools
        run: python -m pip install --upgrade pip build
      - name: Prepare allowlisted stage
        run: python scripts/release_check.py --root . --prepare-stage .validation/ci-stage
      - name: Build wheel and sdist from stage
        run: python -m build --outdir .validation/dist .validation/ci-stage
      - name: Enforce archive gate
        run: python scripts/release_check.py --root .validation/ci-stage --archive-only --archive .validation/dist/d_pan_literature_pipeline-3.0.0-py3-none-any.whl --archive .validation/dist/d_pan_literature_pipeline-3.0.0.tar.gz
      - name: Install built wheel
        run: python -m pip install --force-reinstall .validation/dist/d_pan_literature_pipeline-3.0.0-py3-none-any.whl
      - name: Validate installed wheel outside checkout
        run: python .validation/ci-stage/scripts/ci_validate_installed.py --fixture-source .validation/ci-stage --source-root . --demo-out .validation/ci-demo
